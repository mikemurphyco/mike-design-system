<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Tutorial Overlays — Mike Murphy · AI Handyman</title>
<meta name="ext-resource-dependency" content="assets/avatar-mike-transparent.png" data-resource-id="avatarMike" />
<link rel="stylesheet" href="tokens/colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #F1ECE2; }
  body { font-family: "IBM Plex Sans", system-ui, sans-serif; }
  #root { min-height: 100vh; }
  /* Editable-text affordance — visible on hover and focus, invisible otherwise */
  .mm-editable {
    border-radius: 4px;
    transition: background 120ms ease, box-shadow 120ms ease;
    position: relative;
  }
  .mm-editable:hover:not(:focus) {
    background: rgba(255, 100, 52, 0.07);
    box-shadow: 0 0 0 4px rgba(255, 100, 52, 0.07);
  }
  .mm-editable:focus {
    outline: none;
    background: rgba(255, 100, 52, 0.14);
    box-shadow: 0 0 0 4px rgba(255, 100, 52, 0.32);
  }
</style>
</head>
<body>
