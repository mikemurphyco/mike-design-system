<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img">
  <title>Mike Murphy — Node mark, navy disc</title>
  <desc>System mark alternate. Asymmetric constellation in navy disc. Use on cream or light surfaces.</desc>

  <!-- Cut shadow offset -->
  <circle cx="68" cy="68" r="58" fill="#001E3A" opacity="0.25"/>

  <!-- Disc -->
  <circle cx="64" cy="64" r="58" fill="#001E3A"/>

  <!-- Connectors -->
  <line x1="64" y1="51" x2="34" y2="28" stroke="#FCFAF6" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <line x1="77" y1="58" x2="98" y2="44" stroke="#FCFAF6" stroke-width="2.5" stroke-linecap="round" opacity="0.40"/>
  <line x1="58" y1="77" x2="42" y2="96" stroke="#FCFAF6" stroke-width="2" stroke-linecap="round" opacity="0.28"/>

  <!-- Central node — orange, unchanged -->
  <circle cx="64" cy="64" r="13" fill="#FF6434"/>

  <!-- Upper-left satellite — chalk -->
  <circle cx="30" cy="25" r="9" fill="#FCFAF6"/>

  <!-- Right satellite — teal, unchanged -->
  <circle cx="102" cy="41" r="6.5" fill="#1ECEBE"/>

  <!-- Lower-left satellite — chalk ghost -->
  <circle cx="39" cy="99" r="4.5" fill="#FCFAF6" opacity="0.35"/>
</svg>
