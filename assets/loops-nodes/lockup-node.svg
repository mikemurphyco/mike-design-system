<svg xmlns="http://www.w3.org/2000/svg" width="280" height="64" viewBox="0 0 280 64" role="img">
  <title>Mike Murphy — Node lockup horizontal</title>
  <desc>System brand lockup. Node mark with MIKE MURPHY wordmark.</desc>

  <!-- Node mark at 64px — disc centered in 64×64 area -->
  <circle cx="34" cy="34" r="29" fill="#0D1B2A" opacity="0.08"/>
  <circle cx="32" cy="32" r="29" fill="#FAF7F2"/>

  <line x1="32" y1="25" x2="15" y2="13" stroke="#0D1B2A" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
  <line x1="39" y1="29" x2="50" y2="22" stroke="#0D1B2A" stroke-width="1.5" stroke-linecap="round" opacity="0.40"/>
  <line x1="29" y1="39" x2="21" y2="49" stroke="#0D1B2A" stroke-width="1.5" stroke-linecap="round" opacity="0.28"/>

  <circle cx="32" cy="32" r="7" fill="#FF6434"/>
  <circle cx="13" cy="11" r="5" fill="#0D1B2A"/>
  <circle cx="53" cy="20" r="3.5" fill="#1ECEBE"/>
  <circle cx="19" cy="51" r="2.5" fill="#0D1B2A" opacity="0.35"/>

  <!-- Wordmark — same position as loop lockup -->
  <text
    x="80"
    y="24"
    font-family="'IBM Plex Mono', 'Courier New', monospace"
    font-weight="700"
    font-size="22"
    letter-spacing="-0.03em"
    fill="#0D1B2A"
  >MIKE</text>
  <text
    x="80"
    y="46"
    font-family="'IBM Plex Mono', 'Courier New', monospace"
    font-weight="700"
    font-size="22"
    letter-spacing="-0.03em"
    fill="#0D1B2A"
  >MURPHY</text>
</svg>
